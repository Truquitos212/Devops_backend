services:

  mysql:
    image: mysql:8.0
    container_name: mysql_local
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - innovatech-net

  backend-ventas:
    image: 745505531953.dkr.ecr.us-east-1.amazonaws.com/eksventas:latest
    container_name: api_ventas
    restart: always
    depends_on:
      - mysql
    ports:
      - "8001:8080"
    environment:
      - SPRING_DATASOURCE_URI=jdbc:mysql://mysql:3306/innovatech_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
    networks:
      - innovatech-net

  backend-despachos:
    image: 745505531953.dkr.ecr.us-east-1.amazonaws.com/eksdespacho:latest
    container_name: api_despachos
    restart: always
    depends_on:
      - mysql
    ports:
      - "8002:8080"
    environment:
      - SPRING_DATASOURCE_URI=jdbc:mysql://mysql:3306/innovatech_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
    networks:
      - innovatech-net

networks:
  innovatech-net:
    driver: bridge

volumes:
  mysql_data:
